name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -iname "*.zip" -exec unzip -o {} -d extracted \;
          ls -R extracted | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Java/Kotlin version mismatch
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -1)
          APP_GRADLE=$(find "$PROJECT_DIR" -path "*/app/build.gradle.kts")
          echo "Editing: $APP_GRADLE"
          sed -i '/^android {/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' "$APP_GRADLE"
          cat "$APP_GRADLE"

      - name: Fix Kotlin property syntax errors
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -1)
          MAIN_KT=$(find "$PROJECT_DIR" -name "MainActivity.kt")
          echo "Editing: $MAIN_KT"
          sed -i \
            -e 's/isAllCaps=false/setAllCaps(false)/' \
            -e 's/hintTextColor=muted/setHintTextColor(muted)/' \
            "$MAIN_KT"
          cat "$MAIN_KT"

      - name: Find project root and build
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -1)
          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riya-ai-debug-apk
          path: '**/app-debug.apk'
