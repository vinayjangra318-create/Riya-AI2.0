name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x RiyaAI_AndroidStudio_Project/gradlew || chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd RiyaAI_AndroidStudio_Project || cd .
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riya-ai-debug-apk
          path: '**/app-debug.apk'
